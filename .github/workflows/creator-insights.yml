name: Creator Search Insights (hằng ngày)

on:
  schedule:
    # 06:17 sáng giờ Việt Nam (23:17 UTC)
    - cron: "17 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: creator-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kiểm tra code
        run: python -m unittest discover -s tests -v

      - name: Thu thập từ khóa hot
        run: python -m creator_insights collect

      - name: Lưu dữ liệu vào repo
        run: |
          git config user.name "creator-insights-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/data
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới."
          else
            git commit -m "Cập nhật Search Insights $(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)"
            git push
          fi
